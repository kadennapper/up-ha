name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall custom_components
      - run: python -m json.tool hacs.json
      - run: python -m json.tool custom_components/up_banking/manifest.json
